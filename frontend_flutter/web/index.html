<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <base href="$FLUTTER_BASE_HREF">
  <title>Proposal & SOW Builder v2</title>
  <!-- Use Render backend by default. Set window.USE_LOCAL_API=true in console to use local backend when running on localhost -->
  <script>
    (function () {
      var h = (window.location && window.location.hostname) ? window.location.hostname : '';
      // Default to false so we use Render URL even when running app on localhost
      window.USE_LOCAL_API = false;
    })();
  </script>
  <!-- App Configuration - Load before Flutter app -->
  <script src="config.js"></script>
  <script>
    // Avoid stale Flutter web bundles after `flutter run` / source changes (especially on Chrome).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
  </script>
</head>
<body>
  <script src='flutter_bootstrap.js' async></script>
</body>
</html>
